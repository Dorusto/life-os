name: Deploy Majordom

concurrency:
  group: deploy-majordom
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - "majordom-financiar/**"
      - "tools/vehicle-manager/**"
      - "tools/investment-manager/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest changes
        run: |
          git -C "$MAJORDOM_PATH" fetch origin
          git -C "$MAJORDOM_PATH" reset --hard origin/main

      - name: Rebuild and restart services
        env:
          COMPOSE_PROFILES: vehicle-manager,investment-manager
        run: |
          cd "$MAJORDOM_PATH/majordom-financiar"
          docker compose build --no-cache majordom-api majordom-web \
            vehicle-manager vehicle-manager-web \
            investment-manager investment-manager-web
          for i in 1 2 3; do
            docker compose up -d --remove-orphans && exit 0
            echo "docker compose up -d failed (attempt $i), retrying after port release..."
            sleep 5
          done
          exit 1
