services:
  actual-budget:
    image: actualbudget/actual-server:latest
    container_name: actual-budget
    restart: unless-stopped
    ports:
      - "5006:5006"
    volumes:
      - actual-data:/data
    networks:
      - majordom-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5006/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # --- Ollama (optional — use profile ollama-local when GPU is available locally) ---
  # To connect to an external Ollama server instead, set LLM_BASE_URL in .env and
  # start without this profile: docker compose up
  ollama:
    profiles: ["ollama-local"]
    image: ollama/ollama:latest
    container_name: majordom-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
      - ./scripts/ollama-entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      - LLM_VISION_MODEL=${LLM_VISION_MODEL:-qwen3.5:9b}
      - LLM_CHAT_MODEL=${LLM_CHAT_MODEL:-qwen3.5:9b}
      - OLLAMA_FLASH_ATTENTION=1
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - majordom-net
    healthcheck:
      # Checks both configured models by name (not a loose regex) — a loose
      # "any qwen model" match reported healthy as soon as just the vision
      # model finished pulling, while the chat model was still downloading.
      test: ["CMD-SHELL", "ollama list 2>/dev/null | grep -qF \"$$LLM_VISION_MODEL\" && ollama list 2>/dev/null | grep -qF \"$$LLM_CHAT_MODEL\""]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  majordom-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: majordom-api
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups:ro
    depends_on:
      actual-budget:
        condition: service_healthy
    networks:
      - majordom-net
    # majordom-api is NOT exposed directly to the host.
    # All traffic goes through majordom-web (Nginx) which proxies /api/ here.
    # This keeps the API off the network and forces all requests through Nginx.
    # For local dev without Docker, uncomment the line below:
    # ports:
    #   - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  sqlite-web:
    image: coleifer/sqlite-web
    container_name: majordom-sqlite-web
    restart: unless-stopped
    env_file: .env
    ports:
      # Bound to loopback only, not 0.0.0.0: on a host where `tailscale serve`
      # proxies this same port from the Tailscale interface to 127.0.0.1, a
      # wildcard (0.0.0.0) publish here loses the port to tailscaled's own
      # specific-address bind on every container recreate — Linux won't let a
      # wildcard bind coexist with an existing specific-address bind on the
      # same port. Loopback-only avoids the conflict entirely and matches
      # exactly what `tailscale serve`'s proxy target already expects.
      - "127.0.0.1:8888:8080"
    volumes:
      - ./data:/data
    command: ["sqlite_web", "-H", "0.0.0.0", "-p", "8080", "/data/memory.db"]
    networks:
      - majordom-net

  # --- Vehicle Manager (optional — use profile vehicle-manager to enable fuel/vehicle tracking) ---
  # majordom-api works fine without it; vehicle-related tools/routes just error out
  # if called while it's not running.
  vehicle-manager-sqlite-web:
    profiles: ["vehicle-manager"]
    image: coleifer/sqlite-web
    container_name: vehicle-manager-sqlite-web
    restart: unless-stopped
    ports:
      # Loopback-only — same reasoning as sqlite-web's port above.
      - "127.0.0.1:8889:8080"
    volumes:
      - vehicle-manager-data:/data
    command: ["sqlite_web", "-H", "0.0.0.0", "-p", "8080", "/data/vehicles.db"]
    networks:
      - majordom-net

  vehicle-manager:
    profiles: ["vehicle-manager"]
    build:
      # Cross-directory: ../tools/vehicle-manager lives at the life-os repo
      # root, sibling to majordom-financiar/, not inside it. See #221 and
      # docs/architecture.md's Platform Architecture section.
      context: ../tools/vehicle-manager
      dockerfile: Dockerfile
    container_name: vehicle-manager
    restart: unless-stopped
    environment:
      MAJORDOM_API_URL: ${MAJORDOM_API_URL:-http://majordom-api:8000}
      VEHICLE_MANAGER_JWT_SECRET: ${VEHICLE_MANAGER_JWT_SECRET}
      VEHICLE_MANAGER_USER1_USERNAME: ${VEHICLE_MANAGER_USER1_USERNAME}
      VEHICLE_MANAGER_USER1_PASSWORD: ${VEHICLE_MANAGER_USER1_PASSWORD}
      VEHICLE_MANAGER_SERVICE_TOKEN: ${VEHICLE_MANAGER_SERVICE_TOKEN}
    volumes:
      - vehicle-manager-data:/app/data
    networks:
      - majordom-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  vehicle-manager-web:
    profiles: ["vehicle-manager"]
    build:
      context: ../tools/vehicle-manager/frontend
      dockerfile: Dockerfile
      args:
        VITE_MAJORDOM_FINANCE_URL: ${WEB_PUBLIC_URL:-}
        VITE_INVESTMENT_MANAGER_URL: ${INVESTMENT_MANAGER_PUBLIC_URL:-}
    container_name: vehicle-manager-web
    restart: unless-stopped
    ports:
      # Loopback-only (127.0.0.1), not 0.0.0.0 -- `tailscale serve` binds this
      # exact port on the Tailscale interface, and a wildcard 0.0.0.0 bind
      # can't coexist with that specific-address bind (same root cause
      # already documented for majordom-sqlite-web/actual-budget: whichever
      # binds second silently fails, `docker inspect` shows empty
      # NetworkSettings.Ports even though the container reports "running").
      # Change VEHICLE_MANAGER_WEB_PORT in .env to use a different port (default: 3010)
      - "127.0.0.1:${VEHICLE_MANAGER_WEB_PORT:-3010}:80"
    depends_on:
      vehicle-manager:
        condition: service_started
    networks:
      - majordom-net

  # --- Investment Manager (optional — use profile investment-manager to enable
  # portfolio tracking) --- majordom-api works fine without it; investment-related
  # tools/routes just error out if called while it's not running. Same standalone
  # shape as vehicle-manager — see docs/decisions.md#portfolio-becomes-separate-service
  # and tools/investment-manager/docs/standalone-app-plan.md.
  investment-manager-sqlite-web:
    profiles: ["investment-manager"]
    image: coleifer/sqlite-web
    container_name: investment-manager-sqlite-web
    restart: unless-stopped
    ports:
      # Loopback-only — see sqlite-web's own port comment above for why
      # (tailscale serve's specific-address bind vs. a 0.0.0.0 wildcard bind
      # can't coexist on the same port; this was a real outage on 8888/8889).
      - "127.0.0.1:8890:8080"
    volumes:
      - investment-manager-data:/data
    command: ["sqlite_web", "-H", "0.0.0.0", "-p", "8080", "/data/investments.db"]
    networks:
      - majordom-net

  investment-manager:
    profiles: ["investment-manager"]
    build:
      # Cross-directory: ../tools/investment-manager lives at the life-os repo
      # root, sibling to majordom-financiar/, not inside it — same pattern as
      # vehicle-manager (#221).
      context: ../tools/investment-manager
      dockerfile: Dockerfile
    container_name: investment-manager
    restart: unless-stopped
    environment:
      INVESTMENT_MANAGER_JWT_SECRET: ${INVESTMENT_MANAGER_JWT_SECRET}
      INVESTMENT_MANAGER_USER1_USERNAME: ${INVESTMENT_MANAGER_USER1_USERNAME}
      INVESTMENT_MANAGER_USER1_PASSWORD: ${INVESTMENT_MANAGER_USER1_PASSWORD}
      INVESTMENT_MANAGER_SERVICE_TOKEN: ${INVESTMENT_MANAGER_SERVICE_TOKEN}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY}
    volumes:
      - investment-manager-data:/app/data
    networks:
      - majordom-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  investment-manager-web:
    profiles: ["investment-manager"]
    build:
      context: ../tools/investment-manager/frontend
      dockerfile: Dockerfile
      args:
        VITE_MAJORDOM_FINANCE_URL: ${WEB_PUBLIC_URL:-}
    container_name: investment-manager-web
    restart: unless-stopped
    ports:
      # Loopback-only (127.0.0.1), not 0.0.0.0 -- same tailscale-serve-vs-
      # wildcard-bind conflict as vehicle-manager-web's own port, see its
      # comment for the full explanation.
      # Change INVESTMENT_MANAGER_WEB_PORT in .env to use a different port (default: 3020)
      - "127.0.0.1:${INVESTMENT_MANAGER_WEB_PORT:-3020}:80"
    depends_on:
      investment-manager:
        condition: service_started
    networks:
      - majordom-net

  majordom-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Public Actual Budget URL linked from the Home menu. Leave empty to
        # fall back to the current host on AB's default port (5006).
        VITE_ACTUAL_BUDGET_URL: ${ACTUAL_BUDGET_PUBLIC_URL:-}
        # Public Transport (vehicle-manager) web app URL, for the
        # vehicle-linked-account handoff. Leave empty to keep the local
        # (empty) account detail view instead of redirecting.
        VITE_VEHICLE_APP_URL: ${VEHICLE_APP_PUBLIC_URL:-}
    container_name: majordom-web
    restart: unless-stopped
    ports:
      # Change WEB_PORT in .env to use a different port (default: 3000)
      - "${WEB_PORT:-3000}:80"
    depends_on:
      majordom-api:
        condition: service_started
    networks:
      - majordom-net


volumes:
  actual-data:
    name: majordom-actual-data
  ollama-data:
    name: majordom-ollama-data
  vehicle-manager-data:
    name: vehicle-manager-data
  investment-manager-data:
    name: investment-manager-data

networks:
  majordom-net:
    name: majordom-net
    driver: bridge
