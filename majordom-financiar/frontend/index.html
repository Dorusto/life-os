<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="sage">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA: allows "Add to Home Screen" on iOS and Android -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- iOS-specific: makes the app look native when added to home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Majordom" />

    <!-- Theme color: matches background color so browser chrome blends in -->
    <meta name="theme-color" content="#131312" />

    <!-- Applies the stored theme/accent before first paint, so a light-mode
         user never sees a dark flash (mirrors components/shell/appearance.ts). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('majordom_theme') || localStorage.getItem('theme');
          var a = localStorage.getItem('majordom_accent');
          var root = document.documentElement;
          var theme = t === 'light' ? 'light' : 'dark';
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;
          if (a === 'sage' || a === 'amber' || a === 'olive' || a === 'slate') root.setAttribute('data-accent', a);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f4f3ef' : '#131312');
        } catch (e) {}
      })()
    </script>

    <title>Majordom Financiar</title>
  </head>
  <body>
    <!-- React mounts here -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
