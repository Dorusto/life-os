server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # React Router SPA — every route falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # CRITICAL — read tools/standalone-app-playbook.md section 2.1 before
    # touching this file. The backend API sits behind a distinct /api/
    # prefix (stripped before forwarding), NOT bare paths like /holdings/ or
    # /auth/. Vehicle-manager's first frontend scaffold proxied bare paths
    # and it worked fine with exactly one frontend route — then broke
    # silently the moment a second frontend route (/holdings/:id) collided
    # with the backend's own /holdings/* API prefix, so an unauthenticated
    # page load (hard refresh, bookmark, deep link) hit the JSON API instead
    # of the SPA shell. Do not repeat that mistake here — this app will have
    # more than one frontend route from Phase 1 onward (Dashboard, Holdings,
    # Transactions, Login), so the bug would surface immediately, not later.
    location /api/ {
        proxy_pass http://investment-manager:8020/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10M;
    }

    location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
