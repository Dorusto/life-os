server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the backend hostname dynamically (Docker's embedded DNS at
    # 127.0.0.11), not once at nginx startup. A bare `proxy_pass
    # http://investment-manager:8020/` resolves at config-load time only --
    # if this container's network isn't fully attached yet (or the backend
    # container gets recreated later, changing its IP), nginx either
    # crash-loops forever with "host not found in upstream" or keeps
    # proxying to a stale, dead IP. Found live 2026-09-13: a production
    # deploy that recreated both containers together hit exactly this crash
    # loop. A $variable in proxy_pass forces per-request resolution instead.
    resolver 127.0.0.11 valid=10s;

    # React Router SPA — every route falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # CRITICAL — read tools/standalone-app-playbook.md section 2.1 before
    # touching this file. The backend API sits behind a distinct /api/
    # prefix (stripped before forwarding), NOT bare paths like /holdings/ or
    # /auth/. Vehicle-manager's first frontend scaffold proxied bare paths
    # and it worked fine with exactly one frontend route — then broke
    # silently the moment a second frontend route (/holdings/:id) collided
    # with the backend's own /holdings/* API prefix, so an unauthenticated
    # page load (hard refresh, bookmark, deep link) hit the JSON API instead
    # of the SPA shell. Do not repeat that mistake here — this app will have
    # more than one frontend route from Phase 1 onward (Dashboard, Holdings,
    # Transactions, Login), so the bug would surface immediately, not later.
    location /api/ {
        set $upstream_investment_manager investment-manager;
        proxy_pass http://$upstream_investment_manager:8020/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10M;
    }

    location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
