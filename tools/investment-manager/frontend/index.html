<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="olive">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA: allows "Add to Home Screen" on Android and iOS -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="theme-color" content="#f4f3ef" />
    <title>Majordom Invest</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('majordom_theme') || localStorage.getItem('theme');
          var a = localStorage.getItem('majordom_accent');
          var root = document.documentElement;
          var theme = t === 'light' ? 'light' : 'dark';
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;
          if (a === 'sage' || a === 'amber' || a === 'olive' || a === 'slate') root.setAttribute('data-accent', a);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f4f3ef' : '#131312');
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
