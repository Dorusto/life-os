<!DOCTYPE html>
<!-- The design tokens in src/styles/tokens.css key dark mode off this
     attribute. vehicle-manager keeps its existing dark identity rather than
     following the OS preference: it has no theme toggle, and adding one would
     be a structural change to the nav, not a re-skin. -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA: allows "Add to Home Screen" (Android install prompt) -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-192.png" />

    <!-- Theme color: matches the dark --paper token so browser chrome blends in -->
    <meta name="theme-color" content="#0e151c" />

    <title>Majordom Transport</title>
  </head>
  <body>
    <!-- React mounts here -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
