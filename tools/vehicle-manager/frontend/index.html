<!DOCTYPE html>
<!-- The design tokens in src/styles/tokens.css key theme and accent off these
     attributes. They are this app's defaults; the inline script below applies
     the stored choice (Settings -> Appearance) before first paint so there is
     no flash of the wrong theme. -->
<html lang="en" data-theme="dark" data-accent="amber">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA: allows "Add to Home Screen" (Android install prompt) -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Theme color: matches the dark --paper token so browser chrome blends in -->
    <meta name="theme-color" content="#131312" />

    <script>
      (function () {
        try {
          var t = localStorage.getItem('majordom_theme') || localStorage.getItem('theme');
          var a = localStorage.getItem('majordom_accent');
          var root = document.documentElement;
          var theme = t === 'light' ? 'light' : 'dark';
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;
          if (a === 'sage' || a === 'amber' || a === 'olive' || a === 'slate') root.setAttribute('data-accent', a);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f4f3ef' : '#131312');
        } catch (e) {}
      })()
    </script>

    <title>Majordom Transport</title>
  </head>
  <body>
    <!-- React mounts here -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
