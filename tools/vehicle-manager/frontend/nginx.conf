server {
    listen 80;

    # Serve the React build output
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the backend hostname dynamically (Docker's embedded DNS at
    # 127.0.0.11), not once at nginx startup. A bare `proxy_pass
    # http://vehicle-manager:8010/` resolves at config-load time only -- if
    # this container's network isn't fully attached yet (or the backend
    # container gets recreated later, changing its IP), nginx either
    # crash-loops forever with "host not found in upstream" or keeps
    # proxying to a stale, dead IP. Found live 2026-09-13: a production
    # deploy that recreated both containers together hit exactly this crash
    # loop. A $variable in proxy_pass forces per-request resolution instead.
    resolver 127.0.0.11 valid=10s;

    # React is a Single Page Application — all routes are handled by index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to vehicle-manager's own FastAPI backend, under a single
    # /api/ prefix (stripped before forwarding) — same separation
    # majordom-financiar's own nginx.conf uses, and for the same reason: this
    # app has a React Router page at /vehicles/:id, which collided with a bare
    # /vehicles/ proxy prefix (found live in Phase 4 verification — a direct
    # request to /vehicles/4 without a browser session hit the backend's JSON
    # API and returned a raw 401 instead of the SPA shell). vehicle-manager is
    # not exposed to the host network, only to Docker network — this is the
    # only way in.
    location /api/ {
        set $upstream_vehicle_manager vehicle-manager;
        proxy_pass http://$upstream_vehicle_manager:8010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10M;
    }

    # Cache static assets aggressively — Vite adds content hashes to filenames
    location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable caching for index.html so the app always loads the latest version
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
