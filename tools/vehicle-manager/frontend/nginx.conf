server {
    listen 80;

    # Serve the React build output
    root /usr/share/nginx/html;
    index index.html;

    # React is a Single Page Application — all routes are handled by index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to vehicle-manager's own FastAPI backend.
    # vehicle-manager is not exposed to the host network, only to Docker network —
    # this is the only way in, same reasoning as majordom-financiar's own nginx.conf.
    location /auth/ {
        proxy_pass http://vehicle-manager:8010/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /vehicles/ {
        proxy_pass http://vehicle-manager:8010/vehicles/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /vehicles {
        proxy_pass http://vehicle-manager:8010/vehicles;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /log/ {
        proxy_pass http://vehicle-manager:8010/log/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /import/ {
        proxy_pass http://vehicle-manager:8010/import/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10M;
    }

    location /health {
        proxy_pass http://vehicle-manager:8010/health;
        proxy_set_header Host $host;
    }

    # Cache static assets aggressively — Vite adds content hashes to filenames
    location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable caching for index.html so the app always loads the latest version
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
